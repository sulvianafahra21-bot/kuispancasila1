<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPancasila - Hasil Rekap Nilai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-red: #C8102E; --dark-navy: #111827; --light-bg: #F3F4F6; }
        body { background-color: var(--light-bg); font-family: 'Inter', sans-serif; }
        .sidebar { background-color: var(--dark-navy); min-height: 100vh; color: #E5E7EB; }
        .profile-section { border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .profile-img { width: 85px; height: 85px; border: 3px solid var(--primary-red); object-fit: cover; }
        .nav-pills .nav-link { color: #9CA3AF; margin-bottom: 8px; padding: 12px 20px; border-radius: 10px; }
        .nav-pills .nav-link.active { background-color: var(--primary-red); color: #FFFFFF; }
        .score-circle { width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--primary-red); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; font-size: 2rem; font-weight: 800; color: var(--dark-navy); background-color: rgba(200, 16, 46, 0.05); }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- SIDEBAR (IDENTITAS KREATOR DIKUNCI) -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
            <div class="d-flex flex-column p-3 h-100">
                <div class="text-center profile-section py-4 mb-4">
                    <img src="foto-saya.jpg.jpg" alt="Foto Profil" class="rounded-circle mb-3 profile-img">
                    <h6 class="fw-bold mb-1 text-white">Sulviana Fahra</h6>
                    <span class="badge bg-secondary px-2 py-1 fs-7">NIM: 45223113</span>
                </div>
                <ul class="nav nav-pills flex-column mb-auto px-2">
                    <li class="nav-item"><a href="#" class="nav-link" id="link-beranda"><i class="fa-solid fa-house me-2"></i>Beranda</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" id="link-materi"><i class="fa-solid fa-book-open me-2"></i>Materi Belajar</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" id="link-kuis"><i class="fa-solid fa-pen-to-square me-2"></i>Mulai Kuis (40)</a></li>
                    <li class="nav-item"><a href="#" class="nav-link active" id="link-rekap"><i class="fa-solid fa-chart-simple me-2"></i>Rekap & Peringkat</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 p-4">
            
            <!-- NILAI PRIBADI PESERTA -->
            <div class="row justify-content-center mb-5">
                <div class="col-12 col-md-8 text-center card border-0 p-4 shadow-sm rounded-4" style="border-top: 6px solid var(--primary-red) !important;">
                    <h5 class="fw-bold mb-1">Rapor Evaluasi <span id="nama-rapor" class="text-danger">Peserta</span></h5>
                    <p class="text-secondary small mb-3">Lihat nilai Anda dan bandingkan dengan peringkat kelas di bawah.</p>
                    
                    <div class="score-circle" id="mhs-score-circle">-</div>
                    
                    <h6 class="fw-bold" id="mhs-status-text">Memuat...</h6>
                    <p class="text-muted small mb-3" id="mhs-detail-text"></p>
                    
                    <div>
                        <a href="#" id="btn-re-kuis" class="btn btn-outline-danger rounded-pill px-4 btn-sm">Ulangi Kuis</a>
                    </div>
                </div>
            </div>

            <!-- TABEL KESELURUHAN (LEADERBOARD) -->
            <div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold text-dark"><i class="fa-solid fa-ranking-star text-warning me-2"></i>Papan Peringkat Kelas</h5>
                </div>

                <div class="card border-0 p-3 p-md-4 shadow-sm rounded-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Rank</th>
                                    <th>Nama Lengkap</th>
                                    <th>NIM</th>
                                    <th>Benar</th>
                                    <th>Nilai</th>
                                    <th>Waktu Ujian</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-admin-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username') || 'Peserta';
    const nim = urlParams.get('nim') || '';

    // Menampilkan nama peserta di kotak Rapor
    document.getElementById('nama-rapor').innerText = username;

    const query = `?username=${encodeURIComponent(username)}&nim=${encodeURIComponent(nim)}`;
    document.getElementById('link-beranda').href = "dashboard.html" + query;
    document.getElementById('link-materi').href = "materi.html" + query;
    document.getElementById('link-kuis').href = "kuis.html" + query;
    document.getElementById('link-rekap').href = "rekap.html" + query;
    document.getElementById('btn-re-kuis').href = "kuis.html" + query;

    // Render Data Pribadi
    const nilaiPersonal = localStorage.getItem('nilaiAkhirPancasila');
    const benarPersonal = localStorage.getItem('totalBenar');
    const totalPersonal = localStorage.getItem('totalSoal');

    if (nilaiPersonal !== null) {
        document.getElementById('mhs-score-circle').innerText = nilaiPersonal;
        if(nilaiPersonal >= 75) {
            document.getElementById('mhs-status-text').innerText = "LULUS 🎉";
            document.getElementById('mhs-status-text').className = "fw-bold text-success";
        } else {
            document.getElementById('mhs-status-text').innerText = "Remedial (Di bawah 75)";
            document.getElementById('mhs-status-text').className = "fw-bold text-warning";
        }
        document.getElementById('mhs-detail-text').innerText = `Jawaban Benar: ${benarPersonal} dari ${totalPersonal} soal.`;
    } else {
        document.getElementById('mhs-score-circle').innerText = "-";
        document.getElementById('mhs-status-text').innerText = "Belum Mengikuti Ujian";
        document.getElementById('mhs-status-text').className = "fw-bold text-muted";
    }

    // Render Tabel Global
    let semuaPeserta = JSON.parse(localStorage.getItem('semuaNilaiPancasila')) || [];
    const tbody = document.getElementById('tabel-admin-body');
    tbody.innerHTML = "";
    
    if(semuaPeserta.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Belum ada peserta yang menyelesaikan kuis.</td></tr>`;
    } else {
        // Mengurutkan dari nilai tertinggi ke terendah
        semuaPeserta.sort((a, b) => b.nilai - a.nilai);

        semuaPeserta.forEach((p, index) => {
            let badge = p.nilai >= 75 ? '<span class="badge bg-success-subtle text-success px-2 py-1">Lulus</span>' : '<span class="badge bg-danger-subtle text-danger px-2 py-1">Remedial</span>';
            
            // Highlight baris jika ini adalah data orang yang login
            let isCurrentUser = (p.nama === username && p.nim === nim) ? 'table-warning' : '';

            let peringkat = index + 1;
            if(peringkat === 1) peringkat = `<i class="fa-solid fa-trophy text-warning fs-5"></i> 1`;
            if(peringkat === 2) peringkat = `<i class="fa-solid fa-medal text-secondary fs-5"></i> 2`;
            if(peringkat === 3) peringkat = `<i class="fa-solid fa-medal" style="color: #cd7f32;"></i> 3`;

            tbody.innerHTML += `
                <tr class="${isCurrentUser}">
                    <td class="fw-bold">${peringkat}</td>
                    <td class="fw-bold text-dark">${p.nama}</td>
                    <td><code>${p.nim}</code></td>
                    <td>${p.benar} / ${p.total}</td>
                    <td class="fw-bold text-danger">${p.nilai}</td>
                    <td class="small text-muted">${p.waktu}</td>
                    <td>${badge}</td>
                </tr>`;
        });
    }
</script>
</body>
</html>
