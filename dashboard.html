<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPancasila - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-red: #C8102E; --dark-navy: #111827; --light-bg: #F3F4F6; }
        body { background-color: var(--light-bg); font-family: 'Inter', sans-serif; }
        .sidebar { background-color: var(--dark-navy); min-height: 100vh; color: #E5E7EB; }
        .profile-section { border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .profile-img { width: 85px; height: 85px; border: 3px solid var(--primary-red); object-fit: cover; }
        .nav-pills .nav-link { color: #9CA3AF; margin-bottom: 8px; padding: 12px 20px; border-radius: 10px; font-weight: 500; }
        .nav-pills .nav-link.active { background-color: var(--primary-red); color: #FFFFFF; }
        .top-navbar { background-color: #FFFFFF; border-bottom: 1px solid #E5E7EB; }
        .hero-banner { background: linear-gradient(135deg, #C8102E 0%, #7A0A1C 100%); color: white; border-radius: 16px; }
        .stat-card { border: none; border-radius: 14px; background-color: #FFFFFF; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar p-0">
            <div class="d-flex flex-column p-3 h-100">
                <div class="text-center profile-section py-4 mb-4">
                    <img src="foto-saya.jpg.jpg" alt="Foto Profil" class="rounded-circle mb-3 profile-img">
                    <h6 class="fw-bold mb-1 text-white">Sulviana Fahra</h6>
                    <span class="badge bg-secondary px-2 py-1 fs-7">NIM: 45223113</span>
                </div>
                
                <ul class="nav nav-pills flex-column mb-auto px-2">
                    <li class="nav-item"><a href="#" class="nav-link active" id="link-beranda"><i class="fa-solid fa-house me-2"></i>Beranda</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" id="link-materi"><i class="fa-solid fa-book-open me-2"></i>Materi Belajar</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" id="link-kuis"><i class="fa-solid fa-pen-to-square me-2"></i>Mulai Kuis (40)</a></li>
                    <li class="nav-item"><a href="#" class="nav-link" id="link-rekap"><i class="fa-solid fa-chart-simple me-2"></i>Rekap & Peringkat</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 p-0">
            <div class="top-navbar d-flex justify-content-between align-items-center p-3 px-4">
                <div class="text-muted fw-medium">Akun Aktif: <span class="text-danger fw-bold" id="header-status">User</span></div>
                <a href="index.html" class="btn btn-sm btn-outline-danger px-3 rounded-pill">Keluar</a>
            </div>

            <div class="p-4">
                <div class="card hero-banner p-4 mb-4 border-0 shadow-sm">
                    <h3 class="fw-bold mb-2">Halo, <span id="welcome-name">User</span>!</h3>
                    <p class="mb-0 opacity-75">Selamat datang di Platform Edukasi Pancasila. Silakan pelajari materi yang tersedia, kerjakan evaluasi kuis, dan bersainglah di papan peringkat kelas.</p>
                </div>

                <div class="row g-4 mb-4" id="stats-row-container">
                    </div>
            </div>
        </main>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const username = urlParams.get('username') || 'Peserta';
    const nim = urlParams.get('nim') || '';

    // Tempel identitas ke Header atas
    document.getElementById('header-status').innerText = `${username} (NIM: ${nim || '-'})`;
    document.getElementById('welcome-name').innerText = username;

    // Ikat Link Navigasi agar query string parameter akun ikut terbawa halaman lain
    const query = `?username=${encodeURIComponent(username)}&nim=${encodeURIComponent(nim)}`;
    document.getElementById('link-beranda').href = "dashboard.html" + query;
    document.getElementById('link-materi').href = "materi.html" + query;
    document.getElementById('link-kuis').href = "kuis.html" + query;
    document.getElementById('link-rekap').href = "rekap.html" + query;

    // --- REVISI UTAMA: MENCARI NILAI SPESIFIK BERDASARKAN NIM MAHASISWA AKTIF ---
    let semuaPeserta = JSON.parse(localStorage.getItem('semuaNilaiPancasila')) || [];
    
    // Cari data di database global yang cocok dengan NIM login saat ini
    let dataKuisSaya = semuaPeserta.find(p => p.nim === nim);

    let nilaiDisplay = "Belum Ujian";
    let statusKelulusan = "Belum Ada Nilai";

    if (dataKuisSaya) {
        nilaiDisplay = dataKuisSaya.nilai;
        statusKelulusan = nilaiDisplay >= 75 ? "LULUS 🎉" : "REMEDIAL 📚";
    }

    // Gambar ulang card statistik secara real-time khusus data milik akun aktif
    document.getElementById('stats-row-container').innerHTML = `
        <div class="col-12 col-sm-4"><div class="card stat-card p-3 border-start border-4 border-danger"><span class="text-muted small d-block">TOTAL MATERI</span><h3 class="fw-bold">5 Bab</h3></div></div>
        <div class="col-12 col-sm-4"><div class="card stat-card p-3 border-start border-4 border-warning"><span class="text-muted small d-block">NILAI KUIS ANDA</span><h3 class="fw-bold text-dark">${nilaiDisplay}</h3></div></div>
        <div class="col-12 col-sm-4"><div class="card stat-card p-3 border-start border-4 border-success"><span class="text-muted small d-block">STATUS EVALUASI</span><h3 class="fw-bold text-success">${statusKelulusan}</h3></div></div>
    `;
</script>
</body>
</html>
