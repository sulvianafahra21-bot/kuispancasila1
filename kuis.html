<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Pancasila - 100 Soal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-red: #C8102E; --dark-navy: #111827; }
        body { background-color: #F3F4F6; font-family: 'Inter', sans-serif; }
        .opsi-jawaban {
            display: block; width: 100%; text-align: left; margin-bottom: 12px;
            padding: 15px 20px; border: 2px solid #E5E7EB; border-radius: 10px;
            background: white; font-weight: 500; transition: all 0.2s; cursor: pointer;
        }
        .opsi-jawaban:hover { border-color: var(--primary-red); background-color: rgba(200, 16, 46, 0.05); }
        .opsi-terpilih { background: var(--primary-red) !important; color: white !important; border-color: var(--primary-red); }
    </style>
</head>
<body class="p-4">

<div class="container max-w-3xl mx-auto" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-0">Evaluasi Pancasila</h3>
            <small class="text-muted" id="info-peserta">Peserta: Memuat...</small>
        </div>
        <span class="badge bg-danger fs-6 px-3 py-2 rounded-pill shadow-sm" id="indikatorSoal">Soal 1 / 100</span>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-5">
            <h5 id="teksPertanyaan" class="mb-4 lh-base fw-semibold fs-5 text-dark">Memuat pertanyaan...</h5>
            <div id="areaOpsi"></div>
            
            <div class="d-flex justify-content-between mt-5 pt-3 border-top">
                <button class="btn btn-outline-secondary px-4 fw-medium" onclick="kembaliKeDashboard()">Batal</button>
                <button class="btn btn-danger px-4 fw-medium" onclick="soalSelanjutnya()">Selanjutnya <i class="fas fa-arrow-right ms-2"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    // URL Parameter
    const urlParams = new URLSearchParams(window.location.search);
    const namaUser = urlParams.get('username') || "Peserta";
    const nimUser = urlParams.get('nim') || "";
    const paramQuery = `?username=${encodeURIComponent(namaUser)}&nim=${encodeURIComponent(nimUser)}`;
    
    document.getElementById('info-peserta').innerText = `Peserta: ${namaUser} (${nimUser})`;

    // BANK SOAL (Contoh 30 Soal. Tambahkan terus sampai 100 dengan format yang sama)
    const bankSoal = [
        { pertanyaan: "Pancasila secara etimologis berasal dari bahasa...", opsi: ["Sanskerta", "Kawi", "Jawa Kuno", "Melayu"], jawabanBenar: 0 },
        { pertanyaan: "Siapakah yang pertama kali mengemukakan istilah Pancasila dalam sidang BPUPKI?", opsi: ["Moh. Yamin", "Soepomo", "Soekarno", "Moh. Hatta"], jawabanBenar: 2 },
        { pertanyaan: "Tanggal berapakah yang diperingati sebagai Hari Lahir Pancasila?", opsi: ["18 Agustus", "1 Juni", "17 Agustus", "20 Mei"], jawabanBenar: 1 },
        { pertanyaan: "Sila Keadilan Sosial bagi Seluruh Rakyat Indonesia dilambangkan dengan...", opsi: ["Padi dan Kapas", "Rantai Emas", "Pohon Beringin", "Bintang"], jawabanBenar: 0 },
        { pertanyaan: "Badan yang bertugas merumuskan dasar negara sebelum PPKI dibentuk adalah...", opsi: ["KNIP", "Panitia Sembilan", "BPUPKI", "Budi Utomo"], jawabanBenar: 2 },
        { pertanyaan: "Sikap saling menghormati antar pemeluk agama mencerminkan pengamalan sila ke...", opsi: ["Satu", "Dua", "Tiga", "Lima"], jawabanBenar: 0 },
        { pertanyaan: "Gotong royong merupakan bentuk pengamalan Pancasila, khususnya sila ke...", opsi: ["Satu", "Dua", "Tiga", "Lima"], jawabanBenar: 2 },
        { pertanyaan: "Piagam Jakarta (Jakarta Charter) dirumuskan pada tanggal...", opsi: ["1 Juni 1945", "22 Juni 1945", "18 Agustus 1945", "29 Mei 1945"], jawabanBenar: 1 },
        { pertanyaan: "Ketua Panitia Sembilan yang merumuskan Piagam Jakarta adalah...", opsi: ["A.A. Maramis", "Agus Salim", "Soekarno", "Wahid Hasyim"], jawabanBenar: 2 },
        { pertanyaan: "Sila kedua Pancasila menekankan pada nilai...", opsi: ["Kemanusiaan", "Ketuhanan", "Persatuan", "Keadilan"], jawabanBenar: 0 },
        { pertanyaan: "Musyawarah untuk mufakat adalah ciri khas demokrasi Pancasila yang terdapat pada sila ke...", opsi: ["Dua", "Tiga", "Empat", "Lima"], jawabanBenar: 2 },
        { pertanyaan: "Pancasila berkedudukan sebagai falsafah bangsa, yang artinya...", opsi: ["Sumber hukum tertulis", "Pedoman hidup berbangsa dan bernegara", "Aturan pidana", "Dasar ekonomi"], jawabanBenar: 1 },
        { pertanyaan: "Toleransi dalam kehidupan beragama merupakan wujud dari...", opsi: ["Pasal 27 UUD 1945", "Pasal 29 UUD 1945", "Pasal 30 UUD 1945", "Pasal 33 UUD 1945"], jawabanBenar: 1 },
        { pertanyaan: "Sila ketiga 'Persatuan Indonesia' dilambangkan oleh...", opsi: ["Bintang", "Rantai", "Pohon Beringin", "Kepala Banteng"], jawabanBenar: 2 },
        { pertanyaan: "Makna dari lambang Rantai pada sila kedua adalah...", opsi: ["Kemakmuran", "Kekuatan negara", "Hubungan manusia yang saling membantu", "Keadilan hukum"], jawabanBenar: 2 },
        { pertanyaan: "Siapakah tokoh yang mengubah kalimat 'Ketuhanan dengan kewajiban menjalankan syariat Islam...' menjadi 'Ketuhanan Yang Maha Esa'?", opsi: ["Moh. Hatta", "Soekarno", "Ki Hajar Dewantara", "Ahmad Soebardjo"], jawabanBenar: 0 },
        { pertanyaan: "Nilai praksis dari Pancasila adalah...", opsi: ["Nilai dasar yang mutlak", "Penerapan nilai Pancasila dalam kehidupan sehari-hari", "Aturan dalam UUD", "Kebijakan pemerintah daerah"], jawabanBenar: 1 },
        { pertanyaan: "Sikap tidak bergaya hidup mewah dan boros adalah pengamalan sila ke...", opsi: ["Dua", "Tiga", "Empat", "Lima"], jawabanBenar: 3 },
        { pertanyaan: "Menjaga keseimbangan antara hak dan kewajiban merupakan nilai dari sila...", opsi: ["Satu", "Dua", "Empat", "Lima"], jawabanBenar: 3 },
        { pertanyaan: "Pancasila disahkan secara resmi sebagai dasar negara pada tanggal...", opsi: ["1 Juni 1945", "17 Agustus 1945", "18 Agustus 1945", "19 Agustus 1945"], jawabanBenar: 2 },
        { pertanyaan: "Dimensi Pancasila yang menunjukkan bahwa Pancasila dapat menyesuaikan diri dengan perkembangan zaman disebut dimensi...", opsi: ["Realitas", "Idealisme", "Fleksibilitas (Keterbukaan)", "Kaku"], jawabanBenar: 2 },
        { pertanyaan: "Pemberontakan G30S/PKI merupakan ancaman paling nyata terhadap ideologi Pancasila karena...", opsi: ["Ingin mengganti presiden", "Ingin mengubah bentuk negara", "Ingin mengganti Pancasila dengan komunisme", "Meminta otonomi daerah"], jawabanBenar: 2 },
        { pertanyaan: "Lambang negara Garuda Pancasila dirancang oleh...", opsi: ["Sultan Hamid II", "Soedirman", "Soekarno", "W.R. Supratman"], jawabanBenar: 0 },
        { pertanyaan: "Jumlah bulu pada leher burung Garuda adalah...", opsi: ["17", "8", "19", "45"], jawabanBenar: 3 },
        { pertanyaan: "Semboyan 'Bhinneka Tunggal Ika' diambil dari kitab...", opsi: ["Negarakertagama", "Sutasoma", "Pararaton", "Arjuna Wiwaha"], jawabanBenar: 1 },
        { pertanyaan: "Penulis kitab Sutasoma adalah...", opsi: ["Mpu Prapanca", "Mpu Tantular", "Mpu Sedah", "Mpu Panuluh"], jawabanBenar: 1 },
        { pertanyaan: "Pancasila sebagai paradigma pembangunan artinya...", opsi: ["Pancasila menjadi tolok ukur, landasan, dan arah pembangunan", "Pancasila membatasi kebebasan ekonomi", "Pembangunan hanya untuk kelompok tertentu", "Pembangunan meniru negara barat"], jawabanBenar: 0 },
        { pertanyaan: "Tidak memaksakan kehendak kepada orang lain adalah cerminan sila...", opsi: ["Dua", "Tiga", "Empat", "Lima"], jawabanBenar: 2 },
        { pertanyaan: "Menjunjung tinggi hak asasi manusia (HAM) sangat erat kaitannya dengan sila...", opsi: ["Satu", "Dua", "Tiga", "Empat"], jawabanBenar: 1 },
        { pertanyaan: "Cinta tanah air dan bangsa dapat diwujudkan dengan cara...", opsi: ["Membeli barang impor terus menerus", "Bangga menggunakan produk dalam negeri", "Mengikuti gaya hidup kebarat-baratan", "Merendahkan budaya bangsa lain"], jawabanBenar: 1 }
        // FORMAT UNTUK MENAMBAH SOAL:
        // { pertanyaan: "Tulis pertanyaan di sini", opsi: ["Pilihan A", "Pilihan B", "Pilihan C", "Pilihan D"], jawabanBenar: 0 },
        // (Ingat: jawabanBenar 0 = A, 1 = B, 2 = C, 3 = D)
    ];

    let indeksSoalSaatIni = 0;
    let skor = 0;
    let jawabanDipilih = null;

    function tampilkanSoal() {
        jawabanDipilih = null;
        const soal = bankSoal[indeksSoalSaatIni];
        document.getElementById('teksPertanyaan').innerText = `${indeksSoalSaatIni + 1}. ${soal.pertanyaan}`;
        document.getElementById('indikatorSoal').innerText = `Soal ${indeksSoalSaatIni + 1} / ${bankSoal.length}`;
        
        const areaOpsi = document.getElementById('areaOpsi');
        areaOpsi.innerHTML = '';

        soal.opsi.forEach((pilihan, index) => {
            const button = document.createElement('button');
            button.className = 'opsi-jawaban';
            button.innerText = pilihan;
            button.onclick = () => pilihJawaban(button, index);
            areaOpsi.appendChild(button);
        });
    }

    function pilihJawaban(elemenTombol, index) {
        const semuaTombol = document.querySelectorAll('.opsi-jawaban');
        semuaTombol.forEach(btn => btn.classList.remove('opsi-terpilih'));
        elemenTombol.classList.add('opsi-terpilih');
        jawabanDipilih = index;
    }

    function soalSelanjutnya() {
        if (jawabanDipilih === null) {
            alert("Silakan pilih jawaban terlebih dahulu!");
            return;
        }

        // Cek jawaban
        if (jawabanDipilih === bankSoal[indeksSoalSaatIni].jawabanBenar) {
            skor += 1; // Tambah 1 poin jika benar
        }

        if (indeksSoalSaatIni < bankSoal.length - 1) {
            indeksSoalSaatIni++;
            tampilkanSoal();
        } else {
            // KALKULASI NILAI AKHIR (Konversi ke skala 100)
            let nilaiAkhir = Math.round((skor / bankSoal.length) * 100);
            
            // SIMPAN NILAI KE LOCAL STORAGE
            localStorage.setItem('nilaiAkhirPancasila', nilaiAkhir);
            localStorage.setItem('totalBenar', skor);
            localStorage.setItem('totalSoal', bankSoal.length);

            alert(`Kuis Selesai! Nilai Anda: ${nilaiAkhir}`);
            window.location.href = "dashboard.html" + paramQuery;
        }
    }

    function kembaliKeDashboard() {
        if(confirm("Yakin ingin keluar? Progres kuis tidak akan disimpan.")) {
            window.location.href = "dashboard.html" + paramQuery;
        }
    }

    tampilkanSoal();
</script>

</body>
</html>
