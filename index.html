<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduPancasila</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #111827; /* Navy Gelap senada dengan Sidebar Dashboard */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            border-top: 6px solid #C8102E; /* Aksen Merah */
        }
        .form-control:focus {
            border-color: #C8102E;
            box-shadow: 0 0 0 0.25rem rgba(200, 16, 46, 0.25);
        }
        .btn-danger {
            background-color: #C8102E;
            border: none;
            transition: background 0.2s;
        }
        .btn-danger:hover {
            background-color: #A60D24;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-flag text-danger me-2"></i>EduPancasila</h3>
        <p class="text-secondary small">Silakan lengkapi data untuk mengakses platform kuis</p>
    </div>

    <div id="alert-container"></div>

    <form onsubmit="prosesLogin(event)">
        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Nama Lengkap</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="username" class="form-control" required placeholder="Contoh: Sulviana Fahra">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">NIM</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="nim" class="form-control" required placeholder="Masukkan NIM Anda">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-dark">Token Akses</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-key"></i></span>
                <input type="password" id="token" class="form-control" required placeholder="Masukkan token kuis">
            </div>
            <div class="form-text text-muted small mt-1">Petunjuk token: kuispancasila</div>
        </div>

        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold rounded-3 shadow-sm">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk Dashboard
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function prosesLogin(event) {
        event.preventDefault(); // Menahan form agar tidak langsung refresh halaman

        // Ambil data dari input field
        const namaInput = document.getElementById('username').value.trim();
        const nimInput = document.getElementById('nim').value.trim();
        const tokenInput = document.getElementById('token').value.trim();
        
        const alertContainer = document.getElementById('alert-container');

        // 1. Jalankan Validasi Token
        if (tokenInput !== "kuispancasila") {
            // Jika token salah, tampilkan pesan error merah
            alertContainer.innerHTML = `
                <div class="alert alert-danger d-flex align-items-center rounded-3 mb-3 py-2 fs-7" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>
                    <div>Token salah! Anda tidak dapat mengakses platform ini.</div>
                </div>
            `;
            return; // Hentikan fungsi jika token salah
        }

        // 2. Jika Token Benar, Tampilkan Notifikasi Selamat Datang (Warna Hijau)
        alertContainer.innerHTML = `
            <div class="alert alert-success d-flex align-items-center rounded-3 mb-3 py-2" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i>
                <div>Selamat datang di platform saya! Membuka dashboard...</div>
            </div>
        `;

        // 3. Berikan jeda waktu 1.5 detik agar pengguna bisa melihat notifikasinya, lalu pindah halaman
        setTimeout(() => {
            // Mengarahkan ke halaman dashboard sambil membawa parameter nama dan nim
            const parameterQuery = `?username=${encodeURIComponent(namaInput)}&nim=${encodeURIComponent(nimInput)}`;
            window.location.href = "dashboard.html" + parameterQuery;
        }, 1500); 
    }
</script>

</body>
</html>
