<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login EduPancasila</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #111827; /* Navy Gelap, Senada dengan Sidebar Dashboard */
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Inter', sans-serif; 
        }
        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 420px; 
            border-top: 6px solid #C8102E; /* Garis Aksen Merah Bendera */
        }
        .form-control:focus { 
            border-color: #C8102E; 
            box-shadow: 0 0 0 0.25rem rgba(200, 16, 46, 0.25); 
        }
        .btn-danger { 
            background-color: #C8102E; 
            border: none; 
            transition: background 0.2s;
        }
        .btn-danger:hover { 
            background-color: #A60D24; 
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-flag text-danger me-2"></i>EduPancasila</h3>
        <p class="text-secondary small">Silakan lengkapi data untuk mengakses platform</p>
    </div>

    <div id="alert-container"></div>

    <form onsubmit="prosesLogin(event)">
        <div class="mb-3">
            <label class="form-label fw-semibold text-dark">Nama Lengkap</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="username" class="form-control" required placeholder="Contoh: Sulviana Fahra">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-dark">NIM</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-id-card"></i></span>
                <input type="text" id="nim" class="form-control" required placeholder="Masukkan NIM Anda">
            </div>
        </div>

        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold rounded-3 shadow-sm">
            <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk Platform
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function prosesLogin(event) {
        event.preventDefault(); // Menahan form agar tidak refresh otomatis
        
        const nama = document.getElementById('username').value.trim();
        const nim = document.getElementById('nim').value.trim();
        const alertContainer = document.getElementById('alert-container');

        // Tampilan notifikasi hijau langsung sukses tanpa cek token
        alertContainer.innerHTML = `
            <div class="alert alert-success d-flex align-items-center rounded-3 mb-3 py-2" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i>
                <div>Selamat datang di platform! Membuka halaman utama...</div>
            </div>
        `;

        // Memberikan jeda animasi selama 1.2 detik sebelum beralih ke dashboard
        setTimeout(() => {
            window.location.href = `dashboard.html?username=${encodeURIComponent(nama)}&nim=${encodeURIComponent(nim)}`;
        }, 1200);
    }
</script>
</body>
</html>
