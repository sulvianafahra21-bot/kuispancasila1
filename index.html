<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduPancasila</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1A1A2E;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            border-top: 5px solid #C8102E;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold" style="color: #C8102E;">EduPancasila</h3>
        <p class="text-muted">Silakan masuk untuk melanjutkan</p>
    </div>
    <form onsubmit="login(event)">
        <div class="mb-3">
            <label class="form-label">Nama Lengkap</label>
            <input type="text" id="username" class="form-control" required placeholder="Contoh: Sulviana Fahra">
        </div>
        <div class="mb-4">
            <label class="form-label">NIM</label>
            <input type="text" id="nim" class="form-control" required placeholder="Masukkan NIM Anda">
        </div>
        <button type="submit" class="btn btn-danger w-100" style="background-color: #C8102E;">Masuk Dashboard</button>
    </form>
</div>

<script>
    function login(event) {
        event.preventDefault(); // Mencegah halaman refresh
        // Mengarahkan ke halaman dashboard
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
